<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Singing Monsters</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.cdnfonts.com/css/spooky-monster" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gloria+Hallelujah&family=Ubuntu:wght@400;700&display=swap"
          rel="stylesheet">
</head>
<body>

<section id="title">
    <h1>John Paul Singing Monsters</h1>
    <h3 class="name"></h3>

    <div class="container text-center">
        <div class="row">
            <div class="container-col col-sm-6">
                <div class="d-grid gap-1 d-lg-block">
                    <input id="input-name" type="text" class="form-control" aria-label="Sizing example input"
                           aria-describedby="inputGroup-sizing-lg" placeholder="Enter your name">
                </div>
            </div>
            <div class="container-col col-sm-6">
                <div class="d-grid gap-1 d-lg-block">
                    <button id="name-button" type="button" class="btn btn-success btn-lg">Enter</button>
                </div>
            </div>
        </div>
    </div>
</section>

<section id="monsters">
    <div class="container text-center monster-list" id="monster-container">
        <!-- I bottoni dei mostri verranno generati dinamicamente qui -->
    </div>
</section>

<section id="mystery-monsters">
    <div class="container text-center monster-list" id="mystery-container">
        <!-- I bottoni mystery verranno generati dinamicamente qui -->
    </div>
</section>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
<script src="index.js"></script>

</body>
</html>
